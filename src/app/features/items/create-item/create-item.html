<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="relative bg-white rounded-lg p-6 z-10 max-w-lg w-full mx-4 shadow-xl max-h-[90vh] overflow-y-auto">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Create Item</h2>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          placeholder="Item name"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          name="description"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          placeholder="Optional description"
          rows="2"
        ></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
        <input
          type="number"
          [ngModel]="year()"
          (ngModelChange)="year.set($event)"
          name="year"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          placeholder="e.g. 2024"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <app-autocomplete
          [items]="categories()"
          [displayFn]="categoryDisplay"
          placeholder="Search category..."
          (selectionChange)="selectedCategory.set($event)"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <div id="map" class="h-48 overflow-hidden rounded border border-gray-300"></div>
        @if (coordText()) {
          <p class="text-xs text-gray-500 mt-1">Selected: {{ coordText() }}</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
        <input
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
          class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
        />
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button
          (click)="onClose.emit()"
          [disabled]="creating()"
          class="px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50 transition disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          (click)="create()"
          [disabled]="!canCreate"
          class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-500 transition disabled:opacity-50"
        >
          {{ creating() ? 'Creating...' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
