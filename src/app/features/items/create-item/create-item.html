<app-modal [open]="true" (onClose)="onClose.emit()">
  <app-form
    title="Create Item"
    [disabled]="creating()"
    [valid]="canCreate()"
    [loading]="creating()"
    submitText="Create"
    loadingText="Creating..."
    (cancel)="onClose.emit()"
    (submit)="create()"
  >
    <app-text-input label="Name" [(value)]="name" placeholder="Item name" [required]="true" />
    <app-text-area label="Description" [(value)]="description" placeholder="Optional description" />
    <app-form-field label="Year" [required]="true">
      <input
        type="number"
        [ngModel]="year()"
        (ngModelChange)="year.set($event)"
        class="input-field"
        placeholder="e.g. 2024"
      />
    </app-form-field>

    <app-form-field label="Category" [required]="true">
      <app-autocomplete
        [items]="categoriesStore.categories()"
        [displayFn]="categoryDisplay"
        placeholder="Search category..."
        (selectionChange)="selectedCategory.set($event)"
      />
    </app-form-field>

    <app-form-field label="Location" [required]="true">
      <div id="map" class="h-48 overflow-hidden rounded-lg border border-border-default"></div>
      @if (coordText()) {
        <p class="text-xs text-text-secondary mt-1">Selected: {{ coordText() }}</p>
      }
    </app-form-field>

    <app-form-field label="Photo">
      <input
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)"
        class="w-full text-sm text-text-secondary file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-primary file:text-white hover:file:bg-primary-hover"
      />
    </app-form-field>
  </app-form>
</app-modal>
