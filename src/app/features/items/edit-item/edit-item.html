<div class="pb-12">
  <div class="pt-12 px-4">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold text-white mb-8">Edit Item</h1>

      @if (loading()) {
        <p class="text-text-secondary">Loading...</p>
      } @else {
        <div class="space-y-6">
          <div class="bg-surface-dark border border-border-subtle rounded-xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-white">Basic Information</h2>
            <app-form
              [disabled]="saving()"
              [valid]="canSave()"
              [loading]="saving()"
              submitText="Save Changes"
              loadingText="Saving..."
              (cancel)="cancel()"
              (submit)="save()"
            >
              <app-text-input label="Name" [(value)]="name" [required]="true" placeholder="Item name" />
              <app-text-area label="Description" [(value)]="description" placeholder="Optional description" />
              <app-form-field label="Year" [required]="true">
                <input
                  type="number"
                  [ngModel]="year()"
                  (ngModelChange)="year.set($event)"
                  class="input-field"
                  placeholder="e.g. 2024"
                />
              </app-form-field>

              <app-form-field label="Category" [required]="true">
                <app-autocomplete
                  [items]="categoriesStore.categories()"
                  [displayFn]="categoryDisplay"
                  placeholder="Search category..."
                  (selectionChange)="selectedCategory.set($event)"
                />
              </app-form-field>
            </app-form>
          </div>

          <div class="bg-surface-dark border border-border-subtle rounded-xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-white">Location</h2>
            <app-form-field label="Location">
              <div id="edit-item-map" class="h-48 overflow-hidden rounded-lg border border-border-default"></div>
              @if (coordText()) {
                <p class="text-xs text-text-secondary mt-1">{{ coordLocation() || 'Locating...' }} ({{ coordText() }})</p>
              }
            </app-form-field>
          </div>

          <div class="bg-surface-dark border border-border-subtle rounded-xl p-6 space-y-4">
            <h2 class="text-lg font-semibold text-white">Photos</h2>
            <app-form-field label="Photos">
              @if (photos().length > 0) {
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                  @for (photo of photos(); track photo.id) {
                    <div class="relative group aspect-square bg-surface-nav rounded-lg overflow-hidden">
                      <img [src]="photo.url" [alt]="photo.altText ?? ''" class="w-full h-full object-cover" />
                      <button
                        (click)="deletePhoto(photo.id)"
                        [disabled]="deletingPhotos().has(photo.id)"
                        class="absolute top-2 right-2 p-1.5 bg-red-600 rounded-full opacity-0 group-hover:opacity-100 transition-opacity disabled:opacity-50"
                      >
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                  }
                </div>
              }

              <input
                type="file"
                accept="image/*"
                (change)="onFileSelected($event)"
                class="w-full text-sm text-text-secondary file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-primary file:text-white hover:file:bg-primary-hover"
              />
            </app-form-field>
          </div>
        </div>
      }
    </div>
  </div>
</div>
