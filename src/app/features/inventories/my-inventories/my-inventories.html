<section class="pb-12">
  <div class="pt-12 px-4">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-bold text-white mb-8">My Inventories</h1>

      @if (loading()) {
        <app-skeleton-card [count]="12"/>
      } @else if (error(); as msg) {
        <div class="text-center py-12">
          <p class="text-red-400">{{ msg }}</p>
          <button (click)="loadInventories()"
                  class="mt-4 px-4 py-2 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm transition-colors">
            Retry
          </button>
        </div>
      } @else if (isEmpty()) {
        <div class="text-center py-12 bg-surface-dark border border-border-subtle rounded-xl">
          <p class="text-text-secondary text-lg">You haven't created any inventories yet.</p>
        </div>
      } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          @for (inv of inventories(); track inv.id) {
            <app-inventory-card
              [inventory]="inv"
              [firstPhotoUrl]="inv.firstPhotoUrl ?? null"
              [userName]="auth.currentUser()?.email ?? ''"
              [showActions]="true"
              (toggleVisibility)="onToggleVisibility($event)"
              (edit)="onEdit($event)"
              (delete)="onDelete($event)"
            />
          }
        </div>

        <app-pagination
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          (pageChange)="goToPage($event)"
        />
      }
    </div>
  </div>
</section>

<app-modal
  [open]="showDeleteConfirm()"
  [showConfirm]="true"
  title="Delete inventory"
  confirmLabel="Delete"
  cancelLabel="Cancel"
  [confirmVariant]="'danger'"
  (onClose)="showDeleteConfirm.set(false)"
  (onConfirm)="confirmDelete()"
>
  Are you sure you want to delete this inventory? This action cannot be undone.
</app-modal>
