<article class="max-w-2xl mx-auto mt-20 bg-gray-100 rounded-xl shadow-md p-6">
  <app-form
    title="Create Inventory"
    [disabled]="creating()"
    [valid]="name().trim().length > 0"
    [loading]="creating()"
    submitText="Create"
    loadingText="Creating..."
    (cancel)="onClose.emit()"
    (submit)="create()"
  >
    <app-text-input label="Name" [(value)]="name" placeholder="Inventory name" [required]="true" />
    <app-text-area label="Description" [(value)]="description" placeholder="Optional description" />
    <app-checkbox label="Public inventory" [(checked)]="isPublic" />
  </app-form>
</article>
