<div class="max-w-lg mx-auto p-6">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Inventory</h1>

  @if (loading()) {
    <p class="text-gray-500">Loading...</p>
  } @else if (error()) {
    <p class="text-red-600">{{ error() }}</p>
  } @else {
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          name="description"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          rows="3"
        ></textarea>
      </div>

      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input
          type="checkbox"
          [ngModel]="isPublic()"
          (ngModelChange)="isPublic.set($event)"
          name="isPublic"
          class="rounded border-gray-300"
        />
        Public inventory
      </label>

      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <div class="flex justify-end gap-3 pt-2">
        <button
          (click)="cancel()"
          class="px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50 transition"
        >
          Cancel
        </button>
        <button
          (click)="save()"
          [disabled]="saving() || !name().trim()"
          class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-500 transition disabled:opacity-50"
        >
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </div>
  }
</div>
