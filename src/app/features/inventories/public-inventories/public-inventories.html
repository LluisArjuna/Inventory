<div class="p-6">
  <h1 class="text-2xl font-bold mb-6">Public Inventories</h1>

  @if (loading()) {
    <app-skeleton-card [count]="12" />
  } @else if (error(); as msg) {
    <div class="text-center py-12">
      <p class="text-red-600">{{ msg }}</p>
      <button (click)="loadInventories()"
              class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
        Retry
      </button>
    </div>
  } @else if (isEmpty()) {
    <div class="text-center py-12">
      <p class="text-gray-500 text-lg">No public inventories yet.</p>
    </div>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (inv of inventories(); track inv.id) {
        <app-inventory-card [inventory]="inv" />
      }
    </div>

    @if (totalPages() > 1) {
      <div class="flex justify-center gap-2 mt-8">
        <button (click)="goToPage(currentPage() - 1)"
                [disabled]="currentPage() === 0"
                class="px-3 py-1.5 text-sm rounded border transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50">
          Previous
        </button>

        @for (page of pages(); track page) {
          <button (click)="goToPage(page)"
                  class="px-3 py-1.5 text-sm rounded border transition-colors"
                  [class]="page === currentPage()
                    ? 'bg-blue-600 text-white border-blue-600'
                    : 'hover:bg-gray-50'">
            {{ page + 1 }}
          </button>
        }

        <button (click)="goToPage(currentPage() + 1)"
                [disabled]="currentPage() >= totalPages() - 1"
                class="px-3 py-1.5 text-sm rounded border transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50">
          Next
        </button>
      </div>
    }
  }
</div>
