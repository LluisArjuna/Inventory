<section class="pb-12">
  <div class="pt-12 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-white mb-4">Explore Public Inventories</h1>
        <p class="text-text-secondary text-lg">Discover collections from around the world</p>
      </div>

      @if (loading()) {
        <app-skeleton-card [count]="12" />
      } @else if (error(); as msg) {
        <div class="text-center py-12">
          <p class="text-red-400">{{ msg }}</p>
          <button (click)="loadInventories()"
                  class="mt-4 px-4 py-2 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm transition-colors">
            Retry
          </button>
        </div>
      } @else if (isEmpty()) {
        <div class="text-center py-12">
          <p class="text-text-secondary text-lg">No public inventories yet.</p>
        </div>
      } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          @for (inv of inventories(); track inv.id) {
            <app-inventory-card [inventory]="inv" [firstPhotoUrl]="inv.firstPhotoUrl ?? null" [userName]="inv.userName ?? ''" (onView)="goToInventory($event)" />
          }
        </div>

        <app-pagination
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          (onPageChange)="goToPage($event)"
        />
      }
    </div>
  </div>
</section>
