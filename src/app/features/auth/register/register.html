<div class="flex min-h-screen items-center justify-center">
  <div class="w-full max-w-sm space-y-6 rounded-xl border p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-center">Create account</h1>

    @if (error(); as msg) {
      <p class="text-sm text-red-600 text-center">{{ msg }}</p>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium">Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          class="w-full rounded-lg border px-3 py-2 text-sm"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          class="w-full rounded-lg border px-3 py-2 text-sm"
        />
      </div>

      <div>
        <label for="confirm-password" class="mb-1 block text-sm font-medium">Confirm password</label>
        <input
          id="confirm-password"
          type="password"
          required
          autocomplete="new-password"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
          class="w-full rounded-lg border px-3 py-2 text-sm"
        />
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
      >
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <app-or-divider />

    <app-google-sign-in
      [disabled]="submitting()"
      (signIn)="onGoogleSignIn()"
    />

    <p class="text-center text-sm text-gray-600">
      Already have an account?
      <a routerLink="/login" class="text-blue-600 hover:underline">Sign in</a>
    </p>
  </div>
</div>
