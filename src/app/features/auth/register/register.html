<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6 bg-surface-dark border border-border-subtle rounded-xl p-6 shadow-lg">
    <h1 class="text-xl font-semibold text-white text-center">Create account</h1>

    @if (error(); as msg) {
      <p class="text-sm text-red-400 text-center">{{ msg }}</p>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-text-secondary">Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          class="input-field"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-text-secondary">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          class="input-field"
        />
      </div>

      <div>
        <label for="confirm-password" class="mb-1 block text-sm font-medium text-text-secondary">Confirm password</label>
        <input
          id="confirm-password"
          type="password"
          required
          autocomplete="new-password"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
          class="input-field"
        />
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-lg bg-primary hover:bg-primary-hover px-4 py-2 text-sm font-medium text-white disabled:opacity-50 transition-colors"
      >
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <app-or-divider />

    <app-google-sign-in
      [disabled]="submitting()"
      (signIn)="onGoogleSignIn()"
    />

    <p class="text-center text-sm text-text-secondary">
      Already have an account?
      <a routerLink="/login" class="text-primary hover:text-primary-hover">Sign in</a>
    </p>
  </div>
</div>
