<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4">
  <article class="w-full max-w-sm space-y-6 bg-surface-dark border border-border-subtle rounded-xl p-6 shadow-lg">
    <h1 class="text-xl font-semibold text-white text-center">Sign in</h1>

    @if (error(); as msg) {
      <p class="text-sm text-red-400 text-center" role="alert">{{ msg }}</p>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-text-secondary">Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          class="input-field"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-text-secondary">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          class="input-field"
        />
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-lg bg-primary hover:bg-primary-hover px-4 py-2 text-sm font-medium text-white disabled:opacity-50 transition-colors"
      >
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <app-or-divider />

    <app-google-sign-in
      [disabled]="submitting()"
      (signIn)="onGoogleSignIn()"
    />

    <p class="text-center text-sm text-text-secondary">
      Don't have an account?
      <a routerLink="/register" class="text-primary hover:text-primary-hover">Register</a>
    </p>
  </article>
</section>
