<a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:outline-none">
  Skip to main content
</a>
<app-navbar
  (onCreateInventory)="showCreateDialog.set(true)"
  (onSearch)="onSearch($event)"
/>
@if (showCreateDialog()) {
    <div class="fixed inset-0 bg-black/60 z-40 p-3" role="dialog" aria-modal="true" aria-label="Create inventory" (keydown)="$event.key === 'Escape' && showCreateDialog.set(false)">
      <app-create-inventory (onClose)="showCreateDialog.set(false)"/>
    </div>
}
<main id="main-content" class="min-h-screen bg-surface-page pt-16">
  <router-outlet />
</main>
<app-toast-container />
