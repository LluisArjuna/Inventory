<div class="flex justify-end gap-3 pt-2">
  <button
    (click)="cancel.emit()"
    [disabled]="disabled()"
    class="px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50 transition disabled:opacity-50"
  >
    {{ cancelText() }}
  </button>
  <button
    (click)="submit.emit()"
    [disabled]="disabled() || !valid()"
    class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-500 transition disabled:opacity-50"
  >
    {{ loading() ? loadingText() : submitText() }}
  </button>
</div>
