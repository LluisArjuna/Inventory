<div class="flex justify-end gap-3 pt-2">
  <button
    (click)="cancel.emit()"
    [disabled]="disabled()"
    class="px-4 py-2 text-sm font-medium rounded-lg border border-border-default text-text-secondary hover:bg-surface-dark transition disabled:opacity-50"
  >
    {{ cancelText() }}
  </button>
  <button
    (click)="submit.emit()"
    [disabled]="disabled() || !valid()"
    class="px-4 py-2 text-sm font-medium rounded-lg bg-primary hover:bg-primary-hover text-white transition disabled:opacity-50"
  >
    {{ loading() ? loadingText() : submitText() }}
  </button>
</div>
