<app-form-field [label]="label()" [required]="required()">
  <input
    [type]="type()"
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
    [placeholder]="placeholder()"
  />
</app-form-field>
