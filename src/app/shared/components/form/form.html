@if (title()) {
  <h2 class="text-lg font-semibold text-gray-900 mb-4">{{ title() }}</h2>
}
<div class="space-y-4">
  <ng-content />
  <app-action-buttons
    [disabled]="disabled()"
    [valid]="valid()"
    [loading]="loading()"
    [submitText]="submitText()"
    [loadingText]="loadingText()"
    (cancel)="cancel.emit()"
    (submit)="submit.emit()"
  />
</div>
