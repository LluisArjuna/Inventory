<nav aria-label="Main navigation" class="fixed top-0 left-0 right-0 z-50 bg-surface-nav border-b border-surface-dark h-16">
  <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
    <a routerLink="/" class="flex items-center gap-2 text-white font-semibold text-lg">
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
        <span class="text-white font-bold">I</span>
      </div>
      Inventory
    </a>

    <div class="flex-1 max-w-md mx-8">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          type="text"
          placeholder="Search inventories..."
          aria-label="Search inventories"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearchInput($event)"
          class="w-full bg-surface-search border border-surface-dark rounded-lg pl-10 pr-4 py-2 text-sm text-white placeholder-gray-500 focus:border-primary focus:outline-none transition-colors"
        />
      </div>
    </div>

    <div class="flex items-center gap-3">
      @if (currentUser()) {
        <button
          (click)="onCreateInventory.emit()"
          aria-label="Create inventory"
          class="w-10 h-10 bg-primary hover:bg-primary-hover rounded-full flex items-center justify-center transition-colors"
        >
          <svg class="w-5 h-5 text-white" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
        <a routerLink="/my-inventories" class="px-4 py-2 bg-surface-dark hover:bg-surface-elevated text-gray-300 rounded-lg text-sm transition-colors">
          My Inventories
        </a>
        <button (click)="logout()" aria-label="Logout" class="w-9 h-9 bg-surface-dark hover:bg-surface-elevated rounded-full flex items-center justify-center transition-colors">
          <svg class="w-4 h-4 text-gray-300" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      } @else {
        <a routerLink="/login" class="px-4 py-2 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm transition-colors">
          Login
        </a>
      }
    </div>
  </div>
</nav>
