@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="fixed inset-0 bg-black/50" (click)="onClose.emit()"></div>
    <div class="relative bg-white rounded-lg p-6 z-10 max-w-md w-full mx-4 shadow-xl">
      @if (title()) {
        <h2 class="text-lg font-semibold text-gray-900 mb-4">{{ title() }}</h2>
      }

      @if (showConfirm()) {
        <p class="text-sm text-gray-600 mb-6"><ng-content /></p>
        <div class="flex justify-end gap-3">
          <button
            (click)="onClose.emit()"
            class="px-4 py-2 text-sm font-medium rounded border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors"
          >
            {{ cancelLabel() }}
          </button>
          <button
            (click)="onConfirm.emit()"
            [disabled]="confirmDisabled() || confirmLoading()"
            class="px-4 py-2 text-sm font-medium rounded text-white transition-colors disabled:opacity-50"
            [class]="confirmVariant() === 'danger'
              ? 'bg-red-600 hover:bg-red-700'
              : 'bg-blue-600 hover:bg-blue-700'"
          >
            {{ confirmLoading() ? confirmLabel() + '…' : confirmLabel() }}
          </button>
        </div>
      } @else {
        <ng-content />
      }
    </div>
  </div>
}
