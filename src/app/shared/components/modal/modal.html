@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="fixed inset-0 bg-black/60" (click)="onClose.emit()"></div>
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? 'modal-title' : null"
      class="relative bg-surface-dark border border-border-subtle rounded-xl p-6 z-10 max-w-md w-full mx-4 shadow-xl"
    >
      @if (title()) {
        <h2 id="modal-title" class="text-lg font-semibold text-white mb-4">{{ title() }}</h2>
      }

      @if (showConfirm()) {
        <p class="text-sm text-text-secondary mb-6"><ng-content /></p>
        <div class="flex justify-end gap-3">
          <button
            (click)="onClose.emit()"
            class="px-4 py-2 text-sm font-medium rounded-lg border border-border-default text-text-secondary hover:bg-surface-elevated transition-colors"
          >
            {{ cancelLabel() }}
          </button>
          <button
            (click)="onConfirm.emit()"
            [disabled]="confirmDisabled() || confirmLoading()"
            class="px-4 py-2 text-sm font-medium rounded-lg text-white transition-colors disabled:opacity-50"
            [class]="confirmVariant() === 'danger'
              ? 'bg-red-600 hover:bg-red-700'
              : 'bg-primary hover:bg-primary-hover'"
          >
            {{ confirmLoading() ? confirmLabel() + '...' : confirmLabel() }}
          </button>
        </div>
      } @else {
        <ng-content />
      }
    </div>
  </div>
}
