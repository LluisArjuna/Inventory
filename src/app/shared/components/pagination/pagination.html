@if (totalPages() > 1) {
  <nav aria-label="Pagination" class="flex justify-center gap-2 mt-8">
    <button
      (click)="pageChange.emit(currentPage() - 1)"
      [disabled]="currentPage() === 0"
      class="px-3 py-1.5 text-sm rounded-lg border border-border-default text-text-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-surface-dark"
    >
      Previous
    </button>

    @for (page of pages(); track page) {
      <button
        (click)="pageChange.emit(page)"
        [attr.aria-current]="page === currentPage() ? 'page' : null"
        class="px-3 py-1.5 text-sm rounded-lg border transition-colors"
        [class]="page === currentPage()
          ? 'bg-primary text-white border-primary'
          : 'border-border-default text-text-secondary hover:bg-surface-dark'"
      >
        {{ page + 1 }}
      </button>
    }

    <button
      (click)="pageChange.emit(currentPage() + 1)"
      [disabled]="currentPage() >= totalPages() - 1"
      class="px-3 py-1.5 text-sm rounded-lg border border-border-default text-text-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-surface-dark"
    >
      Next
    </button>
  </nav>
}
