<div class="fixed top-4 right-4 z-100 flex flex-col gap-2 max-w-sm">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white text-sm transition-all"
      [class.bg-red-600]="toast.type === 'error'"
      [class.bg-green-600]="toast.type === 'success'"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button (click)="toastService.remove(toast.id)" class="text-white/70 hover:text-white text-lg leading-none">&times;</button>
    </div>
  }
</div>
