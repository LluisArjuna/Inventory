<div class="rounded-lg shadow-md overflow-hidden bg-white border border-gray-200 relative">
  @if (showActions()) {
    <div class="absolute top-2 right-2 z-10">
      @if (inventory().isPublic) {
        <span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">Public</span>
      } @else {
        <span class="px-2 py-1 text-xs font-medium bg-gray-100 text-gray-600 rounded-full">Private</span>
      }
    </div>
  }

  <div class="h-48 bg-gray-100">
    @if (firstPhotoUrl(); as url) {
      <img [src]="url" alt="Inventory image" class="w-full h-full object-cover" />
    } @else {
      <div class="flex items-center justify-center h-full text-gray-400">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
    }
  </div>

  <div class="p-4">
    <h3 class="text-lg font-semibold text-gray-900 truncate">{{ inventory().name }}</h3>

    @if (truncatedDescription()) {
      <p class="text-sm text-gray-600 mt-1">{{ truncatedDescription() }}</p>
    }

    <p class="text-xs text-gray-500 mt-3 flex items-center gap-1">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      {{ userName() }}
    </p>

    @if (showActions()) {
      <div class="mt-4 pt-3 border-t border-gray-100 flex gap-2">
        <button (click)="toggleVisibility.emit(inventory().id)"
                class="flex-1 px-3 py-1.5 text-xs font-medium rounded transition-colors"
                [class]="inventory().isPublic
                  ? 'bg-yellow-50 text-yellow-700 hover:bg-yellow-100'
                  : 'bg-green-50 text-green-700 hover:bg-green-100'">
          {{ inventory().isPublic ? 'Make Private' : 'Make Public' }}
        </button>
        <button (click)="edit.emit(inventory().id)"
                class="px-3 py-1.5 text-xs font-medium rounded bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors">
          Edit
        </button>
        <button (click)="delete.emit(inventory().id)"
                class="px-3 py-1.5 text-xs font-medium rounded bg-red-50 text-red-700 hover:bg-red-100 transition-colors">
          Delete
        </button>
      </div>
    }
  </div>
</div>
